[project]
name = "cairn-memory"
version = "0.1.0"
description = "Pre-alpha: a provenance-first memory compiler for AI agents, built test-first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50",
    "httpx>=0.28",
    "jinja2>=3.1",
    "markdown-it-py>=4",
    "mcp>=2.3",
    "pydantic>=2.9",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "starlette>=1.10",
    "tzdata>=2026.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]
browser = [
    "axe-playwright-python==0.1.8",
    "playwright==1.64.1",
]

[tool.uv]
default-groups = ["dev", "browser"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests taking multiple seconds or running exhaustive cross-checks",
    "perf: CPU/wall-clock bound checks that must run serially without -n auto",
    "fuzz: generated property/fuzz test sweeps controlled by CAIRN_FUZZ_PROFILE",
    "opentofu: tests that invoke OpenTofu (fail when CAIRN_REQUIRE_TOFU=1)",
    "docker: tests that invoke Docker Compose or containers",
    "browser: Playwright end-to-end tests in tests/browser",
    "ci_meta: static workflow, policy, and repository invariant tests",
    "system: end-to-end journey tests",
]
# A test that runs this long prints every thread's stack, so a stall names itself.
faulthandler_timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_redundant_casts = true

# Ratchet: the 111 currently clean modules are type-checked in CI; the 54 legacy modules
# below stay ignored until typed cleanly one module at a time (remove an entry once clean).
[[tool.mypy.overrides]]
module = [
    "cairn.arrange",
    "cairn.docs_publisher",
    "cairn.identity",
    "cairn.lint",
    "cairn.memory",
    "cairn.oauth",
    "cairn.plans",
    "cairn.spans",
    "cairn.slack.client",
    "cairn.slack.link",
    "cairn.slack.messages",
    "cairn.slack.people",
    "cairn.slack.setup",
    "cairn.slack.shortcuts",
    "cairn.slack.text",
    "cairn.sources.github",
    "cairn.sources.google_drive",
    "cairn.sources.google_meet",
    "cairn.sources.granola",
    "cairn.sources.langfuse",
    "cairn.sources.linear",
    "cairn.sources.runner",
    "cairn.store",
    "cairn.store.base",
    "cairn.store.erasure",
    "cairn.store.history",
    "cairn.store.memory",
    "cairn.store.numbers",
    "cairn.store.portable",
    "cairn.store.ranking",
    "cairn.store.relating",
    "cairn.store.reseal",
    "cairn.store.slack",
    "cairn.store.sources",
    "cairn.store.schema",
    "cairn.web.app",
    "cairn.web.auth",
    "cairn.web.brand",
    "cairn.web.cli",
    "cairn.web.cli_arrange",
    "cairn.web.cli_google",
    "cairn.web.compose",
    "cairn.web.docs_helper",
    "cairn.web.google_connect",
    "cairn.web.graph_view",
    "cairn.web.markdown",
    "cairn.web.mcp",
    "cairn.web.members",
    "cairn.web.public",
    "cairn.web.ratelimit",
    "cairn.web.rest",
    "cairn.web.ui.memory_pages",
    "cairn.web.ui.source_pages",
    "cairn.web.ui.workspace_pages",
]
ignore_errors = true

[tool.bandit]
# Job `static_analysis` of .github/workflows/ci-cd.yml runs Bandit over src/ with this file.
# B608 (SQL built from strings) is off: it flags every SQL text cairn puts together, 107
# places at the time it was switched off, and in each the pieces put in are cairn's own (table
# and column names, its per-account index names, `?` placeholder lists, clauses written in
# the code), while every value goes to SQLite as one of the statement's parameters. Every
# other rule stands; a line where one is wrong says so with `# nosec <rule> # <reason>`.
skips = ["B608"]
