# Every push and pull request runs the tests and lint, and validates the infrastructure and
# deploy files in a job of their own. Every one also builds the image once, for linux/amd64 and
# linux/arm64, in job `image_build`, which may only read the repository, and scans both
# platforms of that build. A v* tag builds nothing: image_build reads the image main's run
# published for the tag's commit as sha-<commit>, by its digest, and every later job checks
# and promotes that digest; a tag whose commit main has not published stops there. A draft pull request runs only those jobs and the other scans. A pull
# request that is ready for review also smoke-tests that build on linux/amd64 and linux/arm64
# (the non-native platform under QEMU) with scripts/smoke_container.py, and rehearses the stack
# and the host, as the next lines say, both with the build's linux/amd64 image. That is the gate a merge waits for. Marking a draft
# ready for review starts a run. Pushes to main, v* tags and manual runs run the whole gate too.
# Except: a change that touches only paths no image job reads (the list is NO_IMAGE_WORK in
# scripts/ci_changes.py: docs/, tests/, evals/, examples/, the files for contributors) runs no
# image check, stack or host rehearsal, so on main it publishes and deploys nothing; its image
# is still built and scanned. Job `changes` runs that script first.
# On main, "the change" is everything since the head of the newest run on main that
# published an image, not only this push: a change whose run failed, was cancelled or had
# its deploy refused is still in it, and ships with the next push.
# When the changed paths cannot be known (a v* tag, a manual run, a first or forced push, no
# run that published, an earlier run on main still going, a failed lookup), the whole gate
# runs. The tests and the infrastructure checks always run.
# Every gate run, draft pull requests included, rehearses the build a tag runs (job
# `package_check`, the same uv build line as job `package`, uploading nothing), so a
# constraints file that no longer resolves, or a hash that no longer matches, fails there and
# never a tag after its image is published; `publish` needs it.
# The shipped compose stack (Caddy, cairn, Litestream) is rehearsed on the runner with
# scripts/rehearse_stack.py, restore from the replica included.
# The VM's own host setup (cloud-init's files, the systemd units and infra/gcp/files/host.sh:
# disk, metadata block, updater, rollback, hold) runs on a runner with scripts/rehearse_host.py,
# and so do the restore runbooks of infra/gcp/README.md, read from the guide as written.
# Pushes to main and v* tags then publish one multi-arch image to ghcr.io/<owner>/<repo>,
# once every job of the gate has passed: the tests, the infrastructure checks, the image
# check, the stack rehearsal and the host rehearsal. A failed infrastructure check stops
# the publication too. What `publish` pushes on main is image_build's archive, checked against
# the SHA-256 the scan and the image check checked, by the index digest they pushed (on a tag,
# that digest is main's, already in the registry, and it is tagged there; the archive is
# copied on a tag only when the registry does not give the digest when asked): it builds
# nothing, checks out nothing and runs no image, and no job that may write to the registry
# or holds an identity token builds or runs the repository's code (deploy runs its one deploy
# script).
# A v* tag is first checked by job `release_check` (scripts/release_check.py), and `publish`
# needs it. It refuses, in one line, a tag pushed to a private repository (a private copy of
# this one runs the same workflow), a tag that is not `v` and the version in pyproject.toml, a
# version whose section of CHANGELOG.md is missing, has no entry, holds a control character
# other than a line feed or a tab, or is dated after the day of
# the run, a tag whose commit is not on main, a tag lower than another of its X.Y, and a
# version that already has a GitHub release. A tag is published as X.Y.Z, a full version
# that never moves: when the registry has it already, `publish` carries on with the same
# digest and stops at another one. A push to main is published as main and sha-<commit>,
# never latest, and sha-<commit> is written once, by the same rule. A tag writes no sha- tag. After a release, job `aliases`, one at a time across all runs, points latest
# at the highest released version and each X.Y at its highest X.Y.z, deciding from the
# releases and the registry as they are when it runs. Job `verify` smoke-tests the published image on main and on tags; in a public
# repository it first pulls the image with no login, as the run guide does (a tag's version,
# or on main the commit's own tag), and checks its digest.
# On a tag, job `package` then builds the wheel and the source archive, with the build backend
# and its dependencies pinned by hash in build-constraints.txt, in a job that may only read the
# repository and holds no secret, and keeps them as an artifact of the run for five days. Job
# `release`, the only job that may write to the repository, builds and installs nothing: it
# checks that the artifact holds one wheel and one source archive of the tag's version, and
# makes the GitHub release with them and the version's section of CHANGELOG.md. A run that
# failed after `publish` and before the release was made is finished by re-running only its
# failed jobs. A tag's run builds nothing, so re-running all of it promotes the same digest
# again. `release` makes the release as a draft, compares the draft's title, notes and files
# with the ones it holds, publishes it with a request of its own and looks again. A re-run of
# it starts from what an earlier attempt left: this run's release published, with the same
# title, notes and files, and it goes on, so that a release tag's `aliases` runs; this run's
# draft with the same, and it publishes it; a release whose title, notes or files are not
# those, and it stops and says what a person does.
# The job's own text issues no delete, and the GitHub CLI, asked for a draft, deletes no
# release it made.
# `package` writes SHA256SUMS over the files it built, and the release publishes it with them.
# Between the two, job `attest`, which holds an identity token and nothing that writes to the
# repository, checks every file against SHA256SUMS, as `release` does, and gives the wheel, the
# source archive, SHA256SUMS and the image's digest each a build provenance attestation.
# A release candidate vX.Y.Z-rc.N (scripts/release_check.py says when one is taken) runs the
# same jobs but `aliases`, attestation included. Its image, main's for its commit, is published
# as X.Y.Z-rc.N only, never X.Y, X.Y.Z or latest, and its GitHub release is a pre-release of
# its own, with its own files, not marked latest; the release tagged later on that commit
# promotes the same digest and makes a second GitHub release.
# Four scans run on every pull request and every push, drafts and changes of documents only
# included, and `publish` needs each: the locked dependencies (pip-audit), both platforms of
# image_build's image (Trivy), src/ (Bandit) and the whole history checked out (gitleaks,
# redacted).
# The quick deploy's OpenTofu definitions (infra/quick/) are checked in job `quick` when a
# change touches them, and on every tag; `publish` needs it too.
# Job `browser` runs the browser tests (tests/browser) in headless Chromium on every pull
# request and every push, with no path condition, and `publish` needs it.
# Nothing is published from a pull request or a manual run.
# A repository whose registry is not ready sets the variable CAIRN_PUBLISH to `false`: the
# gate runs as before, and nothing is published, verified, released or deployed; a v* tag's
# run stops in image_build, since main published no sha-<commit>. Unset, it publishes.
# A push to main then deploys that image, by digest, to the hosted VM (job `deploy`), when the
# repository is configured for it; otherwise that job is skipped. It runs in the environment
# `production`; whether it waits for approval is that environment's setting, which this file
# cannot see. infra/gcp/README.md has the
# settings and the first-deploy checklist. A tag never deploys.
# Where the jobs run: two repository variables, each a JSON value for runs-on, each
# defaulting to ubuntu-latest when unset. CAIRN_GATE_RUNNER names the runner of the gate's
# jobs (`quick` and `browser` aside, which always run on ubuntu-latest) and of `package`,
# which runs the build backend; CAIRN_RELEASE_RUNNER names the runner
# of publish, verify, attest_main, attest, release, aliases and deploy, which no job of a pull
# request uses and which runs no build. Five jobs run the GitHub CLI, gh, which GitHub's runners
# have: release_check and image_build, on a tag, on the runner CAIRN_GATE_RUNNER names, and
# publish, on a push to main, release and aliases, on the runner CAIRN_RELEASE_RUNNER names.
# image_build refuses a gh before 2.102.0, which fixed how gh attestation verify matches
# --signer-workflow and --source-ref (GHSA-wjmr-j3rp-mh2g, GHSA-4mq3-hpgx-9cx8). Job release
# needs gh 2.102.0 or later too, on the runner CAIRN_RELEASE_RUNNER names: what gh does with a
# draft (it makes one and takes none back, and finds one by its tag) was read in that version's
# source and in no earlier one. Its first step refuses an earlier gh, before it fetches or
# writes anything. docs/decisions.md, decision 150, says why there are two.
#
# Actions are pinned to full commit SHAs; each comment names the release the SHA was when
# pinned (resolved with git ls-remote on 2026-11-10; actions/attest read with gh api on
# 2026-11-19). Dependabot keeps them current. oras 1.3.6 and its two archives' SHA-256 were read
# from its release's checksums file, and registry:2.8.3's index digest from Docker Hub, on
# 2026-11-19.
name: cairn-ci-cd

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether `image`, `stack` and `host` run (scripts/ci_changes.py says how). Output
  # `image` is 'false' only when every changed path is on the script's NO_IMAGE_WORK list.
  # On a push to main it asks GitHub's API for this workflow's newest runs on main and their
  # jobs, to find the last commit whose image was published: hence actions: read.
  changes:
    name: what the change touches
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.decide.outputs.image }}
      quick: ${{ steps.decide.outputs.quick }}
      web: ${{ steps.decide.outputs.web }}
    steps:
      # The whole history, so that the base of the diff is there; no token is kept.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether the image jobs run
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_changes.py

  lint:
    name: lint, format, type check, and workflow lint
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --no-default-groups --group dev
      - name: Lint
        run: uv run ruff check . .github/scanners
      - name: Check formatting
        run: uv run ruff format --check . .github/scanners
      - name: Type check
        run: uv run mypy src/
      - name: Check rendered guides
        run: uv run python scripts/render_guides.py --check
      - name: Install actionlint
        uses: ./.github/actions/install-pinned-binary
        with:
          tool: actionlint
      - name: Lint workflows
        run: actionlint -ignore 'unexpected key "queue" for "concurrency" section'

  test:
    name: tests (shard ${{ matrix.shard }})
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --no-default-groups --group dev
      - name: Test shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mapfile -t SHARD_FILES < <(python3 scripts/ci_shard.py --index "$SHARD_INDEX" --total 4)
          if [ "${#SHARD_FILES[@]}" -gt 0 ]; then
            uv run pytest -n auto --dist loadscope -m "not perf" "${SHARD_FILES[@]}"
          fi
      - name: Performance and complexity bounds (serial)
        if: matrix.shard == 0
        run: uv run pytest -m perf

  test_py312:
    name: tests on Python 3.12
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install locked environment on Python 3.12
        run: uv sync --python 3.12 --locked --no-default-groups --group dev
      - name: Run tests on Python 3.12
        run: uv run pytest -n auto --dist loadscope -m "not perf"

  infra:
    name: infrastructure and deploy files
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tofu-plugin-cache
          key: ${{ runner.os }}-tofu-gcp-${{ hashFiles('infra/gcp/.terraform.lock.hcl') }}
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          # The wrapper needs Node on the runner's path; nothing here reads its outputs.
          tofu_wrapper: false
      - name: OpenTofu formatting
        run: tofu -chdir=infra/gcp fmt -check -recursive -diff
      - name: OpenTofu validate
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu -chdir=infra/gcp init -backend=false -input=false
          tofu -chdir=infra/gcp validate -no-color
      # Plans against a mock provider: no project, no credentials. infra/gcp/tests/*.tftest.hcl.
      - name: OpenTofu plan-time checks
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: tofu -chdir=infra/gcp test -no-color
      - name: Host script
        run: |
          bash -n infra/gcp/files/host.sh
          shellcheck infra/gcp/files/host.sh
      - name: Deploy script
        run: |
          bash -n scripts/deploy_production.sh
          shellcheck scripts/deploy_production.sh
      - name: Compose files
        working-directory: deploy
        env:
          CAIRN_DOMAIN: cairn.example.test
          ACME_EMAIL: ops@example.test
        run: |
          docker compose -f compose.yaml config --quiet
          printf 'LITESTREAM_REPLICA_URL=gs://example-bucket/cairn\n' > litestream.env
          docker compose -f compose.yaml -f compose.backup.yaml config --quiet
          docker compose -f compose.local.yaml config --quiet
      - name: Caddy accepts its configuration and filters the logged address
        env:
          CAIRN_DOMAIN: cairn.example.test
          ACME_EMAIL: ops@example.test
        run: |
          caddy() {
            docker run --rm -e CAIRN_DOMAIN -e ACME_EMAIL \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0 caddy "$@"
          }
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > caddy.json
          python3 - <<'PY'
          import json

          found = []

          def walk(node):
              if isinstance(node, dict):
                  if node.get("filter") == "regexp" and "regexp" in node:
                      found.append((node["regexp"], node.get("value")))
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)

          walk(json.load(open("caddy.json")))
          want = ("^(/join/)[^/?#]+|(\\?).*", "${1}${2}redacted")
          assert len(found) == 2 and all(one == want for one in found), found
          PY
      - name: Restore drill on a fresh database
        run: |
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect("drill.db")
          con.executescript("""
              CREATE TABLE accounts (seq INTEGER PRIMARY KEY, id TEXT, name TEXT, created_at TEXT);
              CREATE TABLE projects (id TEXT, account_id TEXT, name TEXT, created_at TEXT);
              CREATE TABLE notes (seq INTEGER PRIMARY KEY, id TEXT, project_id TEXT, text TEXT,
                                     text_sha256 TEXT, title TEXT, created_at TEXT);
              CREATE TABLE spans (id TEXT, note_id TEXT, kind TEXT, heading_path TEXT,
                                  start_line INTEGER, end_line INTEGER, text TEXT);
              CREATE TABLE page_versions (project_id TEXT, slug TEXT, version INTEGER, title TEXT,
                                          body TEXT, claims TEXT, created_at TEXT);
              PRAGMA user_version = 2;
          """)
          con.execute("INSERT INTO notes (id, created_at) VALUES ('cap_0123456789ab', '2026-11-10T00:00:00+00:00')")
          con.commit()
          PY
          python3 scripts/restore_drill.py --db-file drill.db --min-notes 1

  # The build job `package` runs on a tag, rehearsed on every run with the same command line
  # (a test holds the two equal) and the same setup: no secret, a read token the checkout keeps
  # none of, setup-uv with no token and no cache. It uploads nothing.
  package_check:
    name: the release's build, rehearsed
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
          github-token: ""
      - name: Build the wheel and the source archive
        run: >-
          uv build --build-constraint build-constraints.txt --require-hashes
          --out-dir "$RUNNER_TEMP/release"

  # The four scans below run on every pull request and every push, drafts and changes of
  # documents only included (scripts/ci_changes.py, ALWAYS: a secret can arrive in a
  # document), and `publish` needs each. Each may read the repository and nothing more,
  # holds no secret, and runs one tool at one version: the Python ones installed from a
  # hashed requirements file under .github/scanners, the binaries checked against the
  # SHA-256 their release lists before they are unpacked. Their ignore lists, under
  # .github/scanners, give each entry a reason and a last day; tests/unit/test_ci_scans_unit.py
  # fails once that day has passed.

  # The locked dependencies (uv.lock, exported with its hashes: the runtime ones the image
  # installs and the rest) and the build constraints, against PyPI's vulnerability data. A
  # known vulnerability with a fixed version fails; one without a fix is listed in the job's
  # summary (.github/scanners/audit_policy.py).
  dependencies:
    name: scan the locked dependencies (pip-audit)
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
          github-token: ""
      - name: Install pip-audit
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/scan"
          uv pip install --python "$RUNNER_TEMP/scan" --require-hashes -r .github/scanners/pip-audit.txt
      - name: Export the locked dependencies
        run: >-
          uv export --frozen --format requirements.txt --all-extras --all-groups
          --no-emit-project --no-header -o "$RUNNER_TEMP/locked.txt"
      # pip-audit exits 1 when it finds anything; the policy decides what fails.
      - name: Audit them
        run: |
          status=0
          "$RUNNER_TEMP/scan/bin/pip-audit" --disable-pip --require-hashes --strict \
            --progress-spinner off -r "$RUNNER_TEMP/locked.txt" -r build-constraints.txt \
            --format json -o "$RUNNER_TEMP/audit.json" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::pip-audit could not audit the dependencies (exit $status)"
            exit "$status"
          fi
          python3 .github/scanners/audit_policy.py "$RUNNER_TEMP/audit.json" \
            .github/scanners/pip-audit-ignore.toml --summary "$GITHUB_STEP_SUMMARY"

  # Bandit over src/ (tests are outside its scope) at medium severity and medium confidence
  # or above. pyproject.toml, [tool.bandit], says which rule is off and why; a line where a
  # rule is wrong says so with `# nosec <rule> # <reason>`.
  static_analysis:
    name: static analysis of src/ and scripts/ (Bandit)
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
          github-token: ""
      - name: Install Bandit
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/scan"
          uv pip install --python "$RUNNER_TEMP/scan" --require-hashes -r .github/scanners/bandit.txt
      - name: Scan src/
        run: >-
          "$RUNNER_TEMP/scan/bin/bandit" -c pyproject.toml -r src
          --severity-level medium --confidence-level medium
      - name: Scan scripts/ and scanners/
        run: >-
          "$RUNNER_TEMP/scan/bin/bandit" -c .github/scanners/bandit-scripts.toml
          -r scripts .github/scanners --severity-level medium --confidence-level medium

  # gitleaks over the whole history the job checks out (fetch-depth: 0), with every match
  # redacted in the log, and nothing else written. .gitleaks.toml lets the made-up keys of
  # named tests and the vendors' examples quoted in named documents pass, each with its
  # reason; `gitleaks:allow` comments count for nothing. A match fails the job.
  secrets:
    name: scan the history for secrets (gitleaks)
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        uses: ./.github/actions/install-pinned-binary
        with:
          tool: gitleaks
      - name: Scan the history
        run: >-
          gitleaks git --config .gitleaks.toml --redact --ignore-gitleaks-allow
          --exit-code 1 --no-banner --verbose .

  # The one build of the image: linux/amd64 and linux/arm64, with a build provenance and a bill
  # of materials for each (attestation manifests in the image index), written as one OCI layout
  # archive. It runs whenever `changes.image` is not `false` (draft code PRs included, docs/tests-
  # only PRs skipped), may read the repository and nothing more, and logs in to no registry.
  # scripts/oci_archive.py refuses an archive without both platforms and their attestations, or
  # with an image whose config is of another platform, and gives its SHA-256, the index's digest
  # and each platform's own manifest digest (`amd64`, `arm64`) as outputs; the archive is kept
  # as artifact `image` of the run for five days. The scan, the image check and `publish` each
  # check that SHA-256 and push the index's digest, so the image scanned and smoke-tested is the
  # image published, both platforms; a job that takes one platform names it by that platform's
  # own digest, never by the index's and a platform flag. On a v* tag it builds nothing: it reads
  # main's image for the commit, as the steps below say, and the same script checks it.
  image_build:
    name: build the image (linux/amd64 and linux/arm64)
    needs: changes
    if: needs.changes.outputs.image != 'false'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    permissions:
      contents: read
      # On a tag, to read main's attestation of the image it promotes.
      attestations: read
    outputs:
      digest: ${{ steps.archive.outputs.digest }}
      archive: ${{ steps.archive.outputs.archive }}
      amd64: ${{ steps.archive.outputs.amd64 }}
      arm64: ${{ steps.archive.outputs.arm64 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: github.ref_type != 'tag'
        env:
          # The binfmt installer must run natively before emulation exists.
          DOCKER_DEFAULT_PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: github.ref_type != 'tag'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Make the directory the archive goes in
        run: mkdir -p "$RUNNER_TEMP/image"
      # The export is named (buildkit's `name=`) so that buildkit gives every attestation
      # statement each platform's image as its subject; given no name it gives none.
      - name: Build linux/amd64 and linux/arm64
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image/cairn.oci.tar,name=cairn
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=image' || '' }}
      - name: Install oras
        if: github.ref_type == 'tag'
        uses: ./.github/actions/install-pinned-binary
        with:
          tool: oras
      # A tag builds nothing: its image is the one main's run built, checked and published for
      # this commit as sha-<commit> (publish writes that tag once, and only on main). The name
      # only finds it: the proof is the attestation main's run made of that digest after it
      # published and verified it (job attest_main), which gh checks was signed by this
      # repository's ci-cd.yml for a run on refs/heads/main at this tag's full commit, before
      # anything is copied. The digest is that of the bytes read, so a later write to the tag
      # cannot change what is checked. The repository is public on a tag (release_check
      # refuses one that is not), so the reads need no login; gh needs the run's token to ask
      # GitHub for the attestations. It needs the gh CLI on the runner, as GitHub's hosted
      # runners have.
      - name: Fetch the image main's run published for this commit
        id: main
        if: github.ref_type == 'tag'
        run: |
          set -o pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          commit="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          if ! oras manifest fetch "$image:$commit" > "$RUNNER_TEMP/main.json"; then
            echo "::error::$image:$commit could not be read, so main's run has not published $GITHUB_SHA (it is still running, publishing is off, or it built another commit of that push); run this tag's workflow again once main's run for that commit has published it"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$(sha256sum < "$RUNNER_TEMP/main.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check that main's run attested this image for this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.main.outputs.digest }}
        run: |
          if ! command -v gh > /dev/null; then
            echo "::error::gh is not on this runner, so main's attestation of $MAIN cannot be checked; install GitHub CLI on the runner CAIRN_GATE_RUNNER names, or unset it to use GitHub's"
            exit 1
          fi
          # GHSA-wjmr-j3rp-mh2g and GHSA-4mq3-hpgx-9cx8: before 2.102.0, gh matched
          # --signer-workflow as a prefix and --source-ref without case. The version is three
          # numbers and then a space or the end of the line: 2.102.0-rc.1 is not 2.102.0.
          version="$(gh --version | sed -n 's/^gh version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\( .*\)\{0,1\}$/\1/p')"
          IFS=. read -r major minor _ <<< "${version:-0.0.0}"
          if [ "$major" -lt 2 ] || { [ "$major" = 2 ] && [ "$minor" -lt 102 ]; }; then
            echo "::error::gh on this runner is ${version:-of a version it does not print as three plain numbers}, before 2.102.0, which fixed how gh attestation verify matches --signer-workflow and --source-ref, so it is not trusted with main's attestation; update GitHub CLI on the runner CAIRN_GATE_RUNNER names, or unset it to use GitHub's"
            exit 1
          fi
          # Off a terminal gh prints only its error. These are its words, in 2.102.0 and
          # 2.105.0, for no attestation of the digest and for one that does not match the policy;
          # anything else is the tool or the API.
          if ! gh attestation verify "$RUNNER_TEMP/main.json" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/ci-cd.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA" 2> "$RUNNER_TEMP/verify.err"; then
            cat "$RUNNER_TEMP/verify.err" >&2
            if grep -Eq 'no attestations found|verifying with issuer|expected [A-Za-z]+ to be ' "$RUNNER_TEMP/verify.err"; then
              echo "::error::$MAIN has no attestation signed by this repository's ci-cd.yml for a run on refs/heads/main at $GITHUB_SHA, so nothing shows it is main's image of this commit; run this tag's workflow again once main's run for that commit has attested it (job attest_main), or tag a commit whose main run did"
            else
              echo "::error::gh attestation verify could not check $MAIN: the tool failed or GitHub's API could not be reached, as its own words above say; re-run this job"
            fi
            exit 1
          fi
      # The same step every scan runs on its runner's registry, so each pull request proves
      # the copy a tag makes, oras's layout and the script's check of it.
      - name: Copy the image by its digest into a fresh layout and check it
        id: copied
        if: github.ref_type == 'tag'
        env:
          SOURCE: ${{ steps.main.outputs.image }}
          DIGEST: ${{ steps.main.outputs.digest }}
        run: |
          set -o pipefail
          copied="$RUNNER_TEMP/copied"
          rm -rf "$copied"
          mkdir -p "$copied"
          oras cp --to-oci-layout "$SOURCE@$DIGEST" "$copied/layout:main"
          tar -cf "$copied/cairn.oci.tar" -C "$copied/layout" oci-layout index.json blobs
          python3 scripts/oci_archive.py "$copied/cairn.oci.tar" --root "$DIGEST" --github-output "$GITHUB_OUTPUT"
      - name: Hand on main's image as this run's archive
        if: github.ref_type == 'tag'
        run: mv "$RUNNER_TEMP/copied/cairn.oci.tar" "$RUNNER_TEMP/image/cairn.oci.tar"
      - name: Check the archive and give its digests
        id: archive
        env:
          # On a tag, main's index: the layout oras wrote lists the manifests under it too.
          ROOT: ${{ steps.main.outputs.digest }}
        run: python3 scripts/oci_archive.py "$RUNNER_TEMP/image/cairn.oci.tar" ${ROOT:+--root "$ROOT"} --github-output "$GITHUB_OUTPUT"
      # A re-run of this job replaces the artifact (overwrite); its new index digest then
      # differs from a version already published, which `publish` refuses.
      - name: Keep it for the jobs after this one
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image/cairn.oci.tar
          if-no-files-found: error
          retention-days: 5
          overwrite: true
          compression-level: 0

  # Both platforms of the build image_build made, each scanned by its own manifest digest from a
  # registry on the runner after the archive's SHA-256 is checked: what is scanned is what
  # `publish` pushes. Trivy reads the image from that registry (--image-src remote; --insecure
  # for the runner's plain-HTTP registry), not from the engine: it loads a linux/amd64 image
  # unless told otherwise and ignores --platform for an image that is one platform already, so
  # the digest decides, and the step before it checks that digest is this leg's platform. Trivy fails the job on a HIGH or CRITICAL vulnerability that has a fixed
  # version; the unfixed ones are listed in the job's summary and fail nothing. It runs on every
  # change, drafts and documents included, as image_build does.
  image_scan:
    name: scan the built image (Trivy)
    needs: image_build
    if: needs.image_build.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage built image and check copy and platforms
        uses: ./.github/actions/stage-oci-image
        with:
          digest: ${{ needs.image_build.outputs.digest }}
          archive-sha256: ${{ needs.image_build.outputs.archive }}
          native-platform: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          amd64-digest: ${{ needs.image_build.outputs.amd64 }}
          arm64-digest: ${{ needs.image_build.outputs.arm64 }}
          check-copy: "true"
      - name: Install trivy
        uses: ./.github/actions/install-pinned-binary
        with:
          tool: trivy
      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Scan amd64 and arm64 digests and apply policy
        env:
          AMD64: ${{ needs.image_build.outputs.amd64 }}
          ARM64: ${{ needs.image_build.outputs.arm64 }}
        run: |
          set -euo pipefail
          trap 'docker rm --force cairn-registry > /dev/null 2>&1 || true' EXIT
          trivy image --image-src remote --insecure --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile .github/scanners/trivy-ignore.yaml --format json --no-progress \
            --output "$RUNNER_TEMP/trivy-amd64.json" "localhost:5000/cairn@$AMD64"
          trivy image --image-src remote --insecure --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile .github/scanners/trivy-ignore.yaml --format json --no-progress \
            --output "$RUNNER_TEMP/trivy-arm64.json" "localhost:5000/cairn@$ARM64"
          python3 .github/scanners/trivy_policy.py \
            "$RUNNER_TEMP/trivy-amd64.json" "$RUNNER_TEMP/trivy-arm64.json" \
            --ignorefile .github/scanners/trivy-ignore.yaml --summary "$GITHUB_STEP_SUMMARY"

  # The quick deploy's OpenTofu definitions (infra/quick/aws and infra/quick/gcp), with no
  # cloud credentials: formatting, init from the committed lock files (read-only, no
  # backend), validate, and their mocked `tofu test`. On GitHub's hosted linux/amd64 runner
  # and not on CAIRN_GATE_RUNNER: that is where its `tofu test` has been seen to pass (the
  # lock files hold the providers' hashes for linux and macOS on amd64 and arm64 and for
  # Windows on amd64, so `tofu init` works on those). Its steps run when the change touches what scripts/ci_changes.py
  # lists in QUICK_WORK, and always on a tag; the job itself always runs, so that `publish`,
  # which needs it, is never skipped for it.
  quick:
    name: quick deploy definitions (OpenTofu)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache OpenTofu providers
        if: needs.changes.outputs.quick != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tofu-plugin-cache
          key: ${{ runner.os }}-tofu-quick-${{ hashFiles('infra/quick/**/.terraform.lock.hcl') }}
      - name: Set up OpenTofu
        if: needs.changes.outputs.quick != 'false'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false
      - name: Set up uv
        if: needs.changes.outputs.quick != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install the locked environment
        if: needs.changes.outputs.quick != 'false'
        run: uv sync --locked --no-default-groups --group dev
      - name: Check infra/quick/aws and infra/quick/gcp
        if: needs.changes.outputs.quick != 'false'
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra/quick/aws infra/quick/gcp; do
            tofu -chdir="$dir" fmt -check -diff
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$dir" validate -no-color
            tofu -chdir="$dir" test -no-color
          done
      - name: Quick bootstrap script and OpenTofu pytest contract
        if: needs.changes.outputs.quick != 'false'
        env:
          CAIRN_REQUIRE_TOFU: "1"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          bash -n infra/quick/bootstrap.sh
          shellcheck infra/quick/bootstrap.sh
          uv run pytest -m opentofu
      - name: Nothing to check
        if: needs.changes.outputs.quick == 'false'
        run: echo "The change touches nothing the quick deploy's definitions define or read."

  # The browser tests: gated by WEB_WORK (src/cairn/web/, templates/, static/, memory.py,
  # tests/browser/, dependencies) so unrelated PRs skip Chromium setup, while nightly.yml
  # also runs the full suite daily.
  browser:
    name: browser tests (Chromium)
    needs: changes
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked --no-default-groups --group dev --group browser
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
      - name: Install Chromium and its system packages
        run: uv run python -m playwright install --with-deps --only-shell chromium
      - name: Browser tests
        run: uv run pytest tests/browser --run-browser

  # The smoke test of each platform of the build image_build made, pulled by that platform's own
  # manifest digest after the same check image_scan makes; the non-native platform runs under
  # QEMU. Skipped on v* tags once image_build has verified main's attestation for this commit.
  image:
    name: image smoke (${{ matrix.platform }})
    needs: [test, changes, image_build]
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.image != 'false' && github.ref_type != 'tag'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    env:
      LOCAL: cairn:ci
      IMAGE: localhost:5000/cairn@${{ needs.image_build.outputs[matrix.arch] }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: >-
          (runner.arch == 'ARM64' && matrix.arch == 'amd64') ||
          (runner.arch == 'X64' && matrix.arch == 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Stage and pull platform image
        uses: ./.github/actions/stage-oci-image
        with:
          digest: ${{ needs.image_build.outputs.digest }}
          archive-sha256: ${{ needs.image_build.outputs.archive }}
          native-platform: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          pull-image: localhost:5000/cairn@${{ needs.image_build.outputs[matrix.arch] }}
          pull-platform: ${{ matrix.platform }}
          pull-arch: ${{ matrix.arch }}
          local-tag: cairn:ci
          stop-registry: "true"
      - name: Smoke test
        env:
          # The non-native platform starts slowly under QEMU on either runner architecture.
          CAIRN_SMOKE_HEALTH_TIMEOUT: ${{ ((runner.arch == 'ARM64' && matrix.arch == 'amd64') || (runner.arch == 'X64' && matrix.arch == 'arm64')) && '300' || '90' }}
        run: python3 scripts/smoke_container.py "$LOCAL" --platform "$PLATFORM"

  # The shipped compose files, unchanged, on the runner: Caddy in front of cairn with the
  # proxy network cairn trusts, Litestream replicating to a directory, and a lost database
  # restored from it. Skipped on v* tags once image_build verified main's attestation.
  stack:
    name: stack rehearsal (compose, Caddy, Litestream)
    needs: [changes, image_build]
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.image != 'false' && github.ref_type != 'tag'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      LOCAL: cairn:ci
      IMAGE: localhost:5000/cairn@${{ needs.image_build.outputs.amd64 }}
      PLATFORM: linux/amd64
      ARCH: amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: runner.arch == 'ARM64'
        env:
          # The binfmt installer must run natively before emulation exists.
          DOCKER_DEFAULT_PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Stage and pull amd64 image
        uses: ./.github/actions/stage-oci-image
        with:
          digest: ${{ needs.image_build.outputs.digest }}
          archive-sha256: ${{ needs.image_build.outputs.archive }}
          native-platform: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          pull-image: localhost:5000/cairn@${{ needs.image_build.outputs.amd64 }}
          pull-platform: linux/amd64
          pull-arch: amd64
          local-tag: cairn:ci
          stop-registry: "true"
      - name: Rehearse the shipped stack
        run: python3 scripts/rehearse_stack.py cairn:ci

  # The VM's host setup as shipped: infra/gcp/cloud-init.yaml.tftpl rendered, its files
  # installed and its systemd units started on the runner. Skipped on v* tags once
  # image_build verified main's attestation.
  host:
    name: host rehearsal (units, disk, updater)
    needs: [test, changes, image_build]
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      needs.changes.outputs.image != 'false' && github.ref_type != 'tag'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      LOCAL: cairn:ci
      IMAGE: localhost:5000/cairn@${{ needs.image_build.outputs.amd64 }}
      PLATFORM: linux/amd64
      ARCH: amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tofu-plugin-cache
          key: ${{ runner.os }}-tofu-gcp-${{ hashFiles('infra/gcp/.terraform.lock.hcl') }}
      # Only to compare the script's rendering of the template with templatefile's.
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.9"
          tofu_wrapper: false
      - name: Set up QEMU
        if: runner.arch == 'ARM64'
        env:
          # The binfmt installer must run natively before emulation exists.
          DOCKER_DEFAULT_PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # The units the rehearsal starts run docker themselves and do not see this job's
      # environment; systemd's own environment reaches every unit started after this.
      - name: Give the units the same platform
        run: sudo systemctl set-environment "DOCKER_DEFAULT_PLATFORM=$DOCKER_DEFAULT_PLATFORM"
      - name: Stage and pull amd64 image
        uses: ./.github/actions/stage-oci-image
        with:
          digest: ${{ needs.image_build.outputs.digest }}
          archive-sha256: ${{ needs.image_build.outputs.archive }}
          native-platform: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
          pull-image: localhost:5000/cairn@${{ needs.image_build.outputs.amd64 }}
          pull-platform: linux/amd64
          pull-arch: amd64
          local-tag: cairn:ci
          stop-registry: "true"
      # scripts/ci_metadata_fixture.py answers at the metadata address from a network namespace
      # of its own for the length of the rehearsal, so the block is shown by a connection
      # that succeeds before the rules and not after; it fails a run that fell back to the
      # rules-only check.
      - name: Rehearse the VM's host setup
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          sudo env "PATH=$PATH" "DOCKER_DEFAULT_PLATFORM=$DOCKER_DEFAULT_PLATFORM" "TF_PLUGIN_CACHE_DIR=$TF_PLUGIN_CACHE_DIR" python3 scripts/ci_metadata_fixture.py -- python3 scripts/rehearse_host.py cairn:ci --on-this-throwaway-machine

  # On a v* tag, refuses the tag, in one line and before anything is published, unless: the
  # repository is public (the same workflow runs in a private copy, where a tag pushed by habit
  # must publish and release nothing); the tag is `v` + the version in pyproject.toml, and
  # CHANGELOG.md has a section for that version, dated no later than today (UTC), with an
  # entry; its commit is main's head or one of its ancestors; no tag of its MAJOR.MINOR is a
  # higher version; and it has no GitHub release yet, so a released version is published once
  # and the digest people pulled stays the one the package page shows. scripts/release_check.py
  # says how. `publish` needs this job. On main its one check is skipped and the job passes. It runs where
  # `publish` would, so a change that ships nothing, or a repository that publishes nothing,
  # skips it as it skips publish.
  # A run that failed after `publish` and before the release was made: re-run only its failed
  # jobs ("Re-run failed jobs"), which keeps this job's result, image_build's archive and
  # `publish`'s digest. A tag's run builds nothing, so re-running every job promotes the same
  # digest again, until the release exists and this job refuses the tag. If `release` finds no files from `package` (they are kept five days), re-run
  # `package` alone: GitHub re-runs `release` after it, and nothing that publishes.
  release_check:
    name: the tag is the version
    needs: changes
    if: >-
      github.event_name == 'push' && vars.CAIRN_PUBLISH != 'false' &&
      needs.changes.outputs.image != 'false'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    # gh lists the releases with this token, which may read and nothing more.
    permissions:
      contents: read
    # `candidate` is 'true' for a release candidate vX.Y.Z-rc.N. It is compared with == 'true',
    # so an empty one means no. (`latest`, which the script also writes, no job reads: job
    # `aliases` decides it again when it runs.)
    outputs:
      candidate: ${{ steps.check.outputs.candidate }}
    steps:
      # The whole history (fetch-depth: 0): git places the tag's commit on main and among the
      # repository's tags. No token is kept.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        id: check
        if: github.ref_type == 'tag'
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/release_check.py "$GITHUB_REF_NAME"
          --repository-private "$REPOSITORY_PRIVATE"
          --commit "$GITHUB_SHA" --branch origin/main
          --not-released --github-output "$GITHUB_OUTPUT"

  # Promotes the build that was scanned and smoke-tested; builds nothing. It checks the
  # archive's SHA-256 that image_build gave, pushes its OCI layout whole, by the index digest
  # the scan and the image check pulled (oras copies the index and every manifest in it: both
  # platforms and their attestation manifests), and reads every tag back. It checks out
  # nothing, runs no script from the repository and no image. A tag's full version is published
  # once, and on main so is sha-<commit>: when the registry has it already, the same digest is
  # carried on and another digest stops the job, so a re-run never moves it. The rest of its
  # tags (main) are added to the same digest. A tag's digest is main's, in the registry
  # already, so a tag's run tags it there and copies no archive, unless the registry does not
  # give the digest when asked (it is gone, or the request failed): then the archive is copied
  # on a tag too, by the same digest, and on a tag the archive is main's image as image_build
  # read it. `latest` and X.Y are job `aliases`'s, after the release.
  publish:
    name: publish to GHCR
    needs:
      - changes
      - lint
      - test
      - test_py312
      - infra
      - image_build
      - image
      - stack
      - host
      - release_check
      - package_check
      - dependencies
      - static_analysis
      - secrets
      - image_scan
      - quick
      - browser
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      vars.CAIRN_PUBLISH != 'false' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.image != 'false' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.test_py312.result == 'success' &&
      needs.infra.result == 'success' &&
      needs.package_check.result == 'success' &&
      needs.dependencies.result == 'success' &&
      needs.static_analysis.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.release_check.result == 'success' &&
      needs.image_build.result == 'success' &&
      needs.image_scan.result == 'success' &&
      needs.quick.result == 'success' &&
      (needs.browser.result == 'success' || (needs.changes.outputs.web == 'false' && needs.browser.result == 'skipped')) &&
      ((github.ref_type == 'tag' && needs.image.result == 'skipped' && needs.stack.result == 'skipped' && needs.host.result == 'skipped') ||
       (needs.image.result == 'success' && needs.stack.result == 'success' && needs.host.result == 'success'))
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      # The digest of the multi-arch index just pushed: the one thing `deploy` deploys.
      digest: ${{ steps.push.outputs.digest }}
      # The amd64 image of that index, by its own digest, for `verify`'s smoke test.
      amd64: ${{ needs.image_build.outputs.amd64 }}
    steps:
      - name: Install oras
        run: |
          base="https://github.com/oras-project/oras/releases/download/v1.3.6/"
          case "$RUNNER_ARCH" in
            X64) asset=oras_1.3.6_linux_amd64.tar.gz sum=66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0 ;;
            ARM64) asset=oras_1.3.6_linux_arm64.tar.gz sum=b84269e78dfc2d5329a4aab373da3200de95e6c138338cf6c66c10c0a3f248c1 ;;
            *) echo "::error::no oras archive is pinned for a runner of $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base$asset"
          printf '%s  %s\n' "$sum" "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A v* tag gives its full version X.Y.Z; a release candidate vX.Y.Z-rc.N gives X.Y.Z-rc.N
      # (on a pre-release the action makes the whole version of {{version}}), and nothing else:
      # its image is main's, already sha-<commit>. A push to main gives main and sha-<commit>
      # (the action's short SHA, 7 characters by default). Never X.Y or latest: job `aliases`
      # moves those, once the release is made.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
      # The name written once is the full version on a tag and sha-<commit> on main. If the
      # registry has it, the same digest carries on and another stops the job; if the registry
      # has the digest itself (main's image, on a tag; or a first attempt's push), the names
      # are tags of it and the archive is not needed, so a retry works after the artifact has
      # expired. Only a digest the registry does not give when asked (it lacks it, or the
      # request failed: the step does not tell the two apart) is copied from image_build's
      # archive, on main and on a tag alike.
      - name: Look for this build in the registry
        id: decide
        env:
          DIGEST: ${{ needs.image_build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -o pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          names=""
          for tag in $TAGS; do names="$names ${tag##*:}"; done
          names="${names# }"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            first="${GITHUB_REF_NAME#v}"
            once="a full version is published once"
            case " $names " in
              *" sha-"*) echo "::error::the tags asked for [$names] include a sha- tag, but a tag run writes no sha- tag: its image is main's"; exit 1 ;;
            esac
          else
            first="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            once="a commit's image is published once"
          fi
          case " $names " in
            *" $first "*) ;;
            *) echo "::error::the tags asked for [$names] do not include $first"; exit 1 ;;
          esac
          oras repo tags "$image" > "$RUNNER_TEMP/published" || {
            echo "::error::the tags of $image could not be listed, so $first is not pushed: $once"
            exit 1
          }
          copy=true
          if grep -Fxq "$first" "$RUNNER_TEMP/published"; then
            have="$(oras manifest fetch "$image:$first" | sha256sum)"
            if [ "sha256:${have%% *}" != "$DIGEST" ]; then
              echo "::error::$image:$first is sha256:${have%% *} already, not this run's build $DIGEST: $once; to finish the run that published it, re-run only its failed jobs"
              exit 1
            fi
            echo "$image:$first is this build already ($DIGEST): it is not pushed again."
            copy=false
          fi
          archive=false
          if [ "$copy" = true ] && ! oras manifest fetch "$image@$DIGEST" > /dev/null; then
            archive=true
          fi
          {
            echo "image=$image"
            echo "names=$names"
            echo "first=$first"
            echo "copy=$copy"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch the build
        if: steps.decide.outputs.archive == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image
      - name: Push the scanned build
        id: push
        env:
          DIGEST: ${{ needs.image_build.outputs.digest }}
          ARCHIVE: ${{ needs.image_build.outputs.archive }}
          IMAGE: ${{ steps.decide.outputs.image }}
          NAMES: ${{ steps.decide.outputs.names }}
          FIRST: ${{ steps.decide.outputs.first }}
          COPY: ${{ steps.decide.outputs.copy }}
          FROM_ARCHIVE: ${{ steps.decide.outputs.archive }}
          # To read the head of main before the main tag moves.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "$COPY" = true ] && [ "$FROM_ARCHIVE" = true ]; then
            cd "$RUNNER_TEMP/image"
            printf '%s  %s\n' "$ARCHIVE" cairn.oci.tar | sha256sum --check --strict
            mkdir layout
            tar -xf cairn.oci.tar -C layout
            oras cp --from-oci-layout "layout@$DIGEST" "$IMAGE:$FIRST"
          elif [ "$COPY" = true ]; then
            oras tag "$IMAGE@$DIGEST" "$FIRST"
          fi
          # The branch's tag (main) moves only while this run's commit is the branch's head: a
          # retry of an older run would otherwise move it back over a newer commit's image.
          moved=""
          for name in $NAMES; do
            if [ "$name" = "$FIRST" ]; then
              moved="$moved $name"
            elif [ "$GITHUB_REF_TYPE" = branch ] && [ "$name" = "$GITHUB_REF_NAME" ]; then
              if ! head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"; then
                echo "::error::$IMAGE:$FIRST is written, but the head of main could not be read, so $IMAGE:$name is left as it was; re-run this job to move it"
                exit 1
              fi
              if [ "$head" = "$GITHUB_SHA" ]; then
                oras tag "$IMAGE@$DIGEST" "$name"
                moved="$moved $name"
              else
                echo "::notice::main is now at $head, not this run's $GITHUB_SHA, so $IMAGE:$FIRST is written and $IMAGE:$name is left to the run of the newer commit"
              fi
            else
              oras tag "$IMAGE@$DIGEST" "$name"
              moved="$moved $name"
            fi
          done
          for name in $moved; do
            pushed="$(oras manifest fetch "$IMAGE:$name" | sha256sum)"
            if [ "sha256:${pushed%% *}" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$name is sha256:${pushed%% *}, not the build's $DIGEST"
              exit 1
            fi
          done
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # The image job smoke-tested the build `publish` pushed, pulled from a registry on its runner.
  # This runs the same smoke test on the bytes in GHCR, for the platform the VM runs. It runs
  # the published image and the checked-out smoke script, so it gets no OIDC token and no
  # environment secrets: nothing here can ask for a deploy token. In a public repository it
  # first pulls the image the way the run guide tells a reader to, with no login, so the
  # guide's command is tested and a package nobody may pull anonymously fails the run before
  # the release. It does so on main too, by the commit's own tag, so a tag's run, whose image
  # is main's, pulls a digest main's run has pulled already.
  verify:
    name: smoke test of the published image (linux/amd64)
    needs: publish
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
      needs.publish.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      AMD64: ${{ needs.publish.outputs.amd64 }}
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        if: runner.arch == 'ARM64'
        env:
          # Override the AMD64 smoke default until binfmt is installed natively.
          DOCKER_DEFAULT_PLATFORM: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Check the digest
        run: |
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish job reported no image digest"
            exit 1
          fi
          if [[ ! $AMD64 =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish job reported no digest for the amd64 image"
            exit 1
          fi
      # The run guide's own commands, as a reader runs them: logged out, the image pulled by
      # its tag (a release's version, or on main the commit's own `sha-` tag, which no later
      # push moves), and the digest it prints compared with the one `publish` pushed. Only a
      # public repository's image is pulled without a login: a private copy of this one says
      # so and goes on.
      - name: Pull the image as the run guide does, with no login
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "false" ]; then
            echo "This repository is not public: nobody pulls its image without a login."
            exit 0
          fi
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          fi
          image="ghcr.io/$repository:$tag"
          docker logout ghcr.io
          # The pull's status on its own: the step runs as bash -e, without pipefail, and docker
          # pull can print its digest and then fail. Then the digest this pull printed
          # (`Digest: sha256:...`, as docker pull prints it), not the digests the engine knows
          # the name by: it may hold another index from before.
          if docker pull "$image" > "$RUNNER_TEMP/pull.log" 2>&1; then status=0; else status=$?; fi
          cat "$RUNNER_TEMP/pull.log"
          if [ "$status" != 0 ]; then
            echo "::error::docker pull $image with no login failed (exit $status), so nobody can pull it as the run guide says now; check that the package is public on GitHub, then re-run this job"
            exit 1
          fi
          pulled="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/pull.log")"
          if [ "$pulled" != "$DIGEST" ]; then
            echo "::error::$image, pulled with no login, is ${pulled:-no digest} by the digest the pull printed, not $DIGEST, the digest publish pushed, so the tag was moved after publish; release nothing from this run, and re-run this job once the package's page shows the tag at the digest publish pushed"
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test the published image
        env:
          CAIRN_SMOKE_HEALTH_TIMEOUT: ${{ runner.arch == 'ARM64' && '300' || '90' }}
          QUICK_SMOKE: ${{ github.ref_type == 'tag' && '--quick' || '' }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$AMD64"
          docker pull --quiet --platform linux/amd64 "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = amd64
          python3 scripts/smoke_container.py "$image" --platform linux/amd64 ${QUICK_SMOKE:+"$QUICK_SMOKE"}

  # On a push to main, once `publish` has pushed the image and `verify` has pulled and run it:
  # a build provenance attestation of its digest, signed with this run's identity (this
  # repository's ci-cd.yml, refs/heads/main, the commit). A tag's run promotes nothing that
  # lacks one for its commit. The same two steps as attest's image attestation, with the
  # same two permissions: it checks out nothing, runs nothing from the repository and pushes
  # nothing to the registry (push-to-registry is off unless set), so it needs no packages
  # permission.
  attest_main:
    name: build provenance of main's image
    needs: [publish, verify]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'branch' &&
      needs.publish.result == 'success' && needs.verify.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: The image's name
        id: image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish job reported no image digest"
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Attest the image
        env:
          # As actions/attest-build-provenance v4.2.2, its wrapper, sets it.
          NODE_OPTIONS: "--max-http-header-size=32768"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ needs.publish.outputs.digest }}

  # On a v* tag whose image was published and smoke-tested, builds the wheel and the source
  # archive, here and not in `release`: a build backend or a dependency of it that turned
  # hostile runs in a job that may only read the repository and holds no secret, on the gate's
  # runner (decision 150: code a job runs could copy its runner's registration, and the release
  # runner runs no build). uv builds with the versions and hashes in build-constraints.txt
  # (--build-constraint with --require-hashes: a package not listed, or a file whose hash
  # differs, stops the build). The checkout fetches with the job's token and keeps none;
  # setup-uv gets an empty github-token, as uv's version is pinned, and no cache, which the
  # gate's jobs write on that runner. upload-artifact has no token input: it reaches this run's
  # artifacts with the runner's own runtime token. The files and the release's text are kept
  # as an artifact of this run for five days. So is SHA256SUMS, their checksums, which `attest`
  # and `release` each check every file against.
  # The job holds no permission at all: the checkout of a public repository needs none, and
  # `release_check` refuses a tag in a private one. If the checkout ever fails for want of
  # one, give the job `contents: read` again, and nothing more.
  package:
    name: the wheel and the source archive
    needs: [release_check, publish, verify]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.release_check.result == 'success' &&
      needs.publish.result == 'success' && needs.verify.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_GATE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          enable-cache: false
          github-token: ""
      - name: The release's text
        run: |
          mkdir "$RUNNER_TEMP/release"
          python3 scripts/release_check.py "$GITHUB_REF_NAME" --notes > "$RUNNER_TEMP/release/notes.md"
      - name: Build the wheel and the source archive
        run: >-
          uv build --build-constraint build-constraints.txt --require-hashes
          --out-dir "$RUNNER_TEMP/release"
      - name: Their checksums
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum cairn_memory-*.whl cairn_memory-*.tar.gz notes.md > SHA256SUMS
      # Hidden files stay out (the action's default), so the .gitignore uv writes there does too.
      # A re-run of this job replaces the artifact (overwrite): without it the action stops
      # when an artifact of the name exists, so the job could not be re-run within the five days.
      - name: Keep them for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  # A build provenance attestation, signed with this run's identity, for each file `package`
  # built (the wheel, the source archive and SHA256SUMS) and for the image `publish` pushed, by
  # its digest. `gh attestation verify` checks them (README.md, "Releases"). The job holds the
  # identity token and the right to store attestations, so it checks out nothing and runs no
  # code from the repository or from the files: it fetches the artifact, checks every file
  # against SHA256SUMS, as `release` does, and hands them to the pinned action. The attestations
  # stay with GitHub: nothing is pushed to the registry, so it needs no packages permission.
  # The image's attestation is the tag run's, which promoted main's digest; the build
  # provenance inside the image index records main's build.
  attest:
    name: build provenance of the files and the image
    needs: [publish, package]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.publish.result == 'success' && needs.package.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Fetch what package built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # Exactly these four files, hidden ones counted: one wheel and one source archive of
      # the tag's version (a candidate vX.Y.Z-rc.N's files carry X.Y.Z), the release's text,
      # and SHA256SUMS, which lists the other three and nothing else, each with its checksum.
      - name: Check the files
        run: |
          cd "$RUNNER_TEMP/release"
          version="${GITHUB_REF_NAME#v}"
          version="${version%-rc.*}"
          files="$(printf '%s\n' "cairn_memory-$version-py3-none-any.whl" "cairn_memory-$version.tar.gz" notes.md | LC_ALL=C sort)"
          expected="$(printf '%s\n' $files SHA256SUMS | LC_ALL=C sort)"
          found="$(ls -A | LC_ALL=C sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::package's artifact holds [$(printf '%s ' $found)], not one wheel, one source archive, the text and SHA256SUMS of $version"
            exit 1
          fi
          if [ "$(cut -c67- SHA256SUMS | LC_ALL=C sort)" != "$files" ]; then
            echo "::error::SHA256SUMS does not list exactly the wheel, the source archive and the text of $version"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS || {
            echo "::error::a file of package's artifact does not match its checksum in SHA256SUMS"
            exit 1
          }
      - name: The image's name
        id: image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish job reported no image digest"
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Attest the wheel, the source archive and SHA256SUMS
        env:
          # As actions/attest-build-provenance v4.2.2, its wrapper, sets it.
          NODE_OPTIONS: "--max-http-header-size=32768"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.whl
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
      - name: Attest the image
        env:
          # As actions/attest-build-provenance v4.2.2, its wrapper, sets it.
          NODE_OPTIONS: "--max-http-header-size=32768"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ needs.publish.outputs.digest }}

  # A v* tag whose files `package` built and `attest` attested becomes a GitHub release: the
  # wheel, the source archive, SHA256SUMS and the version's section of CHANGELOG.md, all from
  # that job's artifact. The only job that may write to the repository, so it builds nothing,
  # installs nothing and checks out nothing: its token reaches one step, the last, which makes
  # the release. download-artifact gets no token (its github-token has no default and is needed
  # only for another repository or run); it reaches this run's artifacts with the runner's own
  # runtime token and checks their digest. A release candidate becomes a pre-release, never
  # marked latest. A release for the tag that already exists is finished only when it is this
  # run's: the tag, this run's mark, the same pre-release flag, the tag as its title (or no
  # title), the notes this run wrote and the same files, both byte for byte; a draft with them
  # is published, and a published one is left as it is. It needs the gh CLI on its runner, as
  # GitHub's hosted runners have.
  # One such job runs at a time across all runs (its concurrency group, of its own): another
  # tag's `release` waits until this one ends, so no run of this workflow publishes a release
  # between this job's last look and its publication, where it would make this one say it is
  # GitHub's latest above a higher version. `queue: max` lets up to 100 wait: a job waiting is
  # not replaced by a newer one, as GitHub does by default and as a waiting `aliases` is, which
  # would leave its tag without a release. A re-run of this job waits as a first run does. The
  # ones waiting start in the order they began to wait, which GitHub says is not guaranteed: a
  # candidate and its release tagged close together run one after the other, either first, and
  # a candidate published after its release is a pre-release, never the latest. A run re-run
  # later keeps the workflow of its own commit, and a commit from before this group has none.
  # That GitHub takes `queue` in a job's concurrency is read in its workflow syntax reference,
  # not measured.
  release:
    name: GitHub release
    needs: [release_check, publish, verify, package, attest]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.release_check.result == 'success' &&
      needs.publish.result == 'success' && needs.verify.result == 'success' &&
      needs.package.result == 'success' && needs.attest.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    concurrency:
      group: cairn-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      # What this job does with a draft was read in the GitHub CLI's source at v2.102.0 (the
      # last step's comment quotes it) and in no earlier version, and this runner's CLI is not
      # the one image_build checked on the gate's runner. So an earlier one is refused here,
      # read and compared as image_build does, before anything is fetched or written (three
      # numbers and then a space or the end of the line: a pre-release of the tool is not
      # that release). The step is given no token: the CLI prints its version without one.
      - name: Check the GitHub CLI
        run: |
          if ! command -v gh > /dev/null; then
            echo "::error::gh is not on this runner, so the GitHub release for $GITHUB_REF_NAME cannot be made; install GitHub CLI 2.102.0 or later on the runner CAIRN_RELEASE_RUNNER names, or unset it to use GitHub's"
            exit 1
          fi
          version="$(gh --version | sed -n 's/^gh version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\( .*\)\{0,1\}$/\1/p')"
          IFS=. read -r major minor _ <<< "${version:-0.0.0}"
          if [ "$major" -lt 2 ] || { [ "$major" = 2 ] && [ "$minor" -lt 102 ]; }; then
            echo "::error::gh on this runner is ${version:-of a version it does not print as three plain numbers}, before 2.102.0, the version in whose source this job's handling of a draft was read, so it is not trusted with the release; update GitHub CLI on the runner CAIRN_RELEASE_RUNNER names, or unset it to use GitHub's"
            exit 1
          fi
      - name: Fetch what package built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # The same check as in `attest`.
      - name: Check the files
        run: |
          cd "$RUNNER_TEMP/release"
          version="${GITHUB_REF_NAME#v}"
          version="${version%-rc.*}"
          files="$(printf '%s\n' "cairn_memory-$version-py3-none-any.whl" "cairn_memory-$version.tar.gz" notes.md | LC_ALL=C sort)"
          expected="$(printf '%s\n' $files SHA256SUMS | LC_ALL=C sort)"
          found="$(ls -A | LC_ALL=C sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::package's artifact holds [$(printf '%s ' $found)], not one wheel, one source archive, the text and SHA256SUMS of $version"
            exit 1
          fi
          if [ "$(cut -c67- SHA256SUMS | LC_ALL=C sort)" != "$files" ]; then
            echo "::error::SHA256SUMS does not list exactly the wheel, the source archive and the text of $version"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS || {
            echo "::error::a file of package's artifact does not match its checksum in SHA256SUMS"
            exit 1
          }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.release_check.outputs.candidate }}
        run: |
          python3 -I - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          # Measured against GitHub's API on 2026-11-20: a draft made without files was absent from
          # GET /repos/{repo}/releases about 1 s after creation and present after 2.6 s, while a read
          # by id showed each write at once. Look up to LOOKS times, APART seconds apart (27 s max).
          LOOKS = 10
          APART = 3
          STABLE_RE = re.compile(r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")


          def fail(message: str) -> int:
              print(message, flush=True)
              return 1


          def gh(args: list[str], *, binary: bool = False) -> subprocess.CompletedProcess:
              return subprocess.run(["gh", *args], capture_output=True, text=not binary, check=False)


          def parse_pages(raw: str) -> list[dict]:
              decoder = json.JSONDecoder()
              items: list[dict] = []
              idx, length = 0, len(raw)
              while idx < length:
                  while idx < length and raw[idx].isspace():
                      idx += 1
                  if idx >= length:
                      break
                  page, idx = decoder.raw_decode(raw, idx)
                  if not isinstance(page, list):
                      raise ValueError("expected JSON list of releases")
                  items.extend(page)
              return items


          def stable_versions(tags: list[str]) -> list[tuple[int, int, int]]:
              parsed: list[tuple[int, int, int]] = []
              for t in tags:
                  if m := STABLE_RE.fullmatch(t):
                      parsed.append((int(m[1]), int(m[2]), int(m[3])))
              return sorted(parsed)


          def release_snapshot(rel: dict) -> tuple:
              assets = sorted(
                  (a.get("id"), a.get("name"), a.get("state"), a.get("size"), a.get("updated_at"))
                  for a in (rel.get("assets") or [])
              )
              return (
                  rel.get("tag_name"),
                  rel.get("name"),
                  bool(rel.get("draft")),
                  bool(rel.get("prerelease")),
                  rel.get("body") or "",
                  assets,
              )


          def main() -> int:
              runner_temp = Path(os.environ["RUNNER_TEMP"])
              release_dir = runner_temp / "release"
              os.chdir(release_dir)

              tag = os.environ["GITHUB_REF_NAME"]
              sha = os.environ["GITHUB_SHA"]
              repo = os.environ["GH_REPO"]
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              want_pre = os.environ.get("CANDIDATE", "") == "true"

              version = tag.removeprefix("v").split("-rc.", 1)[0]
              files = [f"cairn_memory-{version}-py3-none-any.whl", f"cairn_memory-{version}.tar.gz", "SHA256SUMS"]
              want = " ".join(sorted(files))
              want_set = sorted(files)

              mark = f"<!-- cairn-ci-cd run {run_id} -->"
              expected_body = Path("notes.md").read_bytes() + f"\n{mark}\n".encode("utf-8")
              body_file = runner_temp / "body.md"
              body_file.write_bytes(expected_body)
              compared = "so nothing was compared"

              # Tag read uses `GET /repos/{owner}/{repo}/commits/{ref}` with SHA header (works for
              # annotated tags too). Drafts set --target $sha (`if opts.Target != "" {`,
              # `params["target_commitish"] = opts.Target`; cli/cli at v2.102.0; "Unused if the Git tag
              # already exists. Default: the repository's default branch."). Zero removal calls anywhere.
              def check_tag() -> bool:
                  res = gh(["api", "-H", "Accept: application/vnd.github.sha", f"repos/{repo}/commits/tags/{tag}"])
                  at = res.stdout.strip() if res.returncode == 0 else ""
                  if res.returncode != 0 or not SHA_RE.fullmatch(at):
                      if res.stderr:
                          sys.stderr.write(res.stderr)
                      fail(f"::error::the tag {tag} could not be read as a commit of the repository (it is gone, or GitHub did not answer: gh's own words, if any, are above), so this job writes nothing more for its release and does not call it finished; re-run this job if the repository's tags page shows {tag} at this run's commit {sha}, and otherwise publish nothing for it")
                      return False
                  if at != sha:
                      fail(f"::error::the tag {tag} names commit {at}, not this run's commit {sha}, whose files this run built and attested, so this job writes nothing more for its release and does not call it finished; delete this run's release for it on the repository's releases page if there is one and nobody should publish it, and re-run this job only once the tag names {sha} again")
                      return False
                  return True

              def refuse(reason: str) -> None:
                  fail(f"::error::read by its id, a GitHub release for {tag} exists and is not one this run can finish: {reason}; look at it on the repository's releases page, delete it if nobody should publish it, and re-run this job")

              def judge_row(rel: dict) -> bool:
                  body = rel.get("body") or ""
                  if mark not in body:
                      refuse(f"its text does not carry run {run_id}'s mark")
                      return False
                  pre = bool(rel.get("prerelease"))
                  if pre is not want_pre:
                      pre_s = "true" if pre else "false"
                      want_s = "true" if want_pre else "false"
                      refuse(f"its pre-release flag is {pre_s}, not {want_s}")
                      return False
                  state = "a draft" if rel.get("draft") else "public"
                  title_ok = rel.get("name") in (None, "", tag)
                  notes_ok = body.encode("utf-8") == expected_body
                  if not title_ok or not notes_ok:
                      what = "title and notes" if (not title_ok and not notes_ok) else ("title" if not title_ok else "notes")
                      fail(f"::error::read by its id, the GitHub release for {tag}, {state}, carries run {run_id}'s mark and differs from what that run wrote in its {what}; delete it on the repository's releases page if it is still a draft, or put back what the run wrote, and re-run this job")
                      return False
                  return True

              def row_fits(row: dict) -> bool:
                  body = row.get("body") or ""
                  return (
                      mark in body
                      and bool(row.get("prerelease")) is want_pre
                      and row.get("name") in (None, "", tag)
                      and body.encode("utf-8") == expected_body
                  )

              def fresh(rid: int) -> dict | None:
                  res = gh(["api", f"repos/{repo}/releases/{rid}"])
                  if res.returncode != 0:
                      if res.stderr:
                          sys.stderr.write(res.stderr)
                      if "HTTP 404" in (res.stderr or ""):
                          fail(f"::error::the GitHub release for {tag}, which GitHub's listing showed, was not found when read by its id, so it has probably been deleted; re-run this job, which starts from what is listed then")
                      else:
                          fail(f"::error::the GitHub release for {tag} could not be read by its id, as the lines above say, {compared}; re-run this job, and delete nothing")
                      return None
                  rel = json.loads(res.stdout)
                  if rel.get("tag_name") != tag:
                      fail(f"::error::the release GitHub's listing showed for {tag} is, read by its id, a release of another tag; look at it on the repository's releases page, and re-run this job, which starts from what is listed then")
                      return None
                  if not judge_row(rel):
                      return None
                  names = " ".join(sorted(str(a.get("name", "")) for a in (rel.get("assets") or [])))
                  if names != want:
                      reason = f"its files are [{names}], not [{want}]"
                      if rel.get("draft"):
                          fail(f"::error::read by its id, the GitHub release for {tag} is this run's draft and does not hold exactly the files this run attested: {reason}; this job neither deletes nor publishes it; delete it on the repository's releases page and re-run this job, which makes the release again")
                      else:
                          refuse(reason)
                      return None
                  return rel

              def look() -> tuple[bool, dict | None, list[str]]:
                  res = gh(["api", "--paginate", f"repos/{repo}/releases?per_page=100"])
                  if res.returncode != 0:
                      if res.stderr:
                          sys.stderr.write(res.stderr)
                      fail(f"::error::the repository's releases could not be listed, so whether {tag} has one is not known; re-run this job")
                      return False, None, []
                  try:
                      items = parse_pages(res.stdout)
                  except ValueError:
                      fail(f"::error::the repository's releases could not be listed, so whether {tag} has one is not known; re-run this job")
                      return False, None, []
                  for_tag = [r for r in items if r.get("tag_name") == tag]
                  released = [
                      r["tag_name"]
                      for r in items
                      if r.get("tag_name") != tag and not r.get("draft") and not r.get("prerelease") and isinstance(r.get("tag_name"), str)
                  ]
                  if len(for_tag) > 1:
                      count = len(for_tag)
                      fail(f"::error::GitHub's listing shows {count} releases for {tag}, and this job finishes a release only when it is its tag's only one; the listing can be seconds behind a write, so look at the repository's releases page first: when it shows more than one, delete those nobody should publish, keeping a public release of this run that holds its files, and re-run this job")
                      return False, None, released
                  if len(for_tag) == 1:
                      row = for_tag[0]
                      if not row_fits(row):
                          rel = fresh(row["id"])
                          if rel is None:
                              return False, None, released
                          state = "a draft" if rel.get("draft") else "public"
                          fail(f"::error::GitHub's listing shows the release for {tag} without this run's mark, pre-release flag, title or notes, while read by its id it is {state} and has all four as this run wrote them; the listing can be seconds behind a write, an edit a person has since undone included, so look at the repository's releases page first, then re-run this job, which starts from what is listed then")
                          return False, None, released
                      return True, row, released
                  return True, None, released

              def some_files(row: dict) -> bool:
                  names = [str(a.get("name", "")) for a in (row.get("assets") or [])]
                  if sorted(names) == want_set or len(names) >= len(want_set):
                      return False
                  left = list(want_set)
                  for name in names:
                      if name in left:
                          left.remove(name)
                      else:
                          return False
                  return True

              def look_after(mode: str) -> tuple[bool, dict | None, list[str]]:
                  for n in range(1, LOOKS + 1):
                      ok, row, released = look()
                      if not ok:
                          return False, None, released
                      keep_waiting = (
                          (row is None or (bool(row.get("draft")) and some_files(row)))
                          if mode == "made"
                          else (row is not None and bool(row.get("draft")))
                      )
                      if not keep_waiting or n >= LOOKS:
                          return True, row, released
                      time.sleep(APART)
                  return True, None, []

              def same_files(rel: dict) -> dict | None:
                  nonlocal compared
                  is_draft = bool(rel.get("draft"))
                  state = "a draft" if is_draft else "public"
                  by_name = {a.get("name"): a for a in (rel.get("assets") or [])}
                  for name in files:
                      asset = by_name.get(name) or {}
                      aid = asset.get("id")
                      local_bytes = Path(name).read_bytes()
                      bad_meta = not (
                          isinstance(aid, int)
                          and not isinstance(aid, bool)
                          and asset.get("state") == "uploaded"
                          and asset.get("size") == len(local_bytes)
                      )
                      if bad_meta:
                          reason = f"{name} is not the file this run attested"
                          if is_draft:
                              fail(f"::error::read by its id, the GitHub release for {tag} is this run's draft and does not hold exactly the files this run attested: {reason}; this job neither deletes nor publishes it; delete it on the repository's releases page and re-run this job, which makes the release again")
                          else:
                              refuse(reason)
                          return None
                      res = gh(["api", "--allow-escape-sequences", "-H", "Accept: application/octet-stream", f"repos/{repo}/releases/assets/{aid}"], binary=True)
                      if res.returncode != 0:
                          if res.stderr:
                              sys.stderr.write(res.stderr.decode("utf-8", "replace"))
                          fail(f"::error::the files of the GitHub release for {tag}, {state} as read by its id, could not be downloaded, so they were not compared and nothing shows that they differ; re-run this job, and delete nothing unless the releases page shows a file of the draft missing or unfinished")
                          return None
                      if res.stdout != local_bytes:
                          reason = f"{name} is not the file this run attested"
                          if is_draft:
                              fail(f"::error::read by its id, the GitHub release for {tag} is this run's draft and does not hold exactly the files this run attested: {reason}; this job neither deletes nor publishes it; delete it on the repository's releases page and re-run this job, which makes the release again")
                          else:
                              refuse(reason)
                          return None
                  compared = "after its three files were fetched and each was found to be the file this run attested, so whether the release changed around their download is not known"
                  rel2 = fresh(rel["id"])
                  if rel2 is None:
                      return None
                  if release_snapshot(rel2) != release_snapshot(rel):
                      changed_state = "a draft" if rel2.get("draft") else "public"
                      fail(f"::error::the GitHub release for {tag}, {changed_state}, changed between this job's two reads of it by its id, around the download of its files, so the files it compared may not be the ones the release holds; re-run this job, which reads and compares it again")
                      return None
                  return rel2

              if not check_tag():
                  return 1
              ok, found, released = look()
              if not ok:
                  return 1
              if found is None:
                  cmd = ["release", "create", tag, "--draft", "--verify-tag", "--target", sha, "--title", tag, "--notes-file", str(body_file)]
                  if want_pre:
                      cmd.extend(["--prerelease", "--latest=false"])
                  cmd.extend(files)
                  res = gh(cmd)
                  if res.stdout:
                      sys.stdout.write(res.stdout)
                  if res.stderr:
                      sys.stderr.write(res.stderr)
                  if res.returncode != 0:
                      return res.returncode or 1
                  ok, found, released = look_after("made")
                  if not ok:
                      return 1
                  if found is None:
                      return fail(f"::error::GitHub's listing, at this job's last look, does not list the release for {tag} as this job has just left it, and it can be seconds behind a write; look at the repository's releases page first, then re-run this job, which starts from what is listed then")

              rel = fresh(found["id"])
              if rel is None:
                  return 1

              said = ""
              if rel.get("draft"):
                  rel = same_files(rel)
                  if rel is None:
                      return 1
                  make_latest = "false"
                  if not rel.get("prerelease"):
                      parsed = stable_versions([*released, tag])
                      if parsed and f"v{'.'.join(map(str, parsed[-1]))}" == tag:
                          make_latest = "true"
                  said = make_latest
                  if not check_tag():
                      return 1
                  res = gh(["api", "--method", "PATCH", f"repos/{repo}/releases/{rel['id']}", "--silent", "-F", "draft=false", "-f", f"make_latest={make_latest}"])
                  if res.stdout:
                      sys.stdout.write(res.stdout)
                  if res.stderr:
                      sys.stderr.write(res.stderr)
                  if res.returncode != 0:
                      return res.returncode or 1
                  compared = "after this job compared its draft's files with this run's and published it, so the published release's files were not compared"
                  ok, found, released = look_after("published")
                  if not ok:
                      return 1
                  if found is None or bool(found.get("draft")):
                      return fail(f"::error::GitHub's listing, at this job's last look, does not list the release for {tag} as this job has just left it, and it can be seconds behind a write; look at the repository's releases page first, then re-run this job, which starts from what is listed then")
                  rel = fresh(found["id"])
                  if rel is None:
                      return 1

              rel = same_files(rel)
              if rel is None:
                  return 1
              if rel.get("draft"):
                  return fail(f"::error::the GitHub release for {tag}, read by its id after this job published it, is a draft again; look at it on the repository's releases page, and re-run this job, which compares it and publishes it again if it is still this run's")
              if not check_tag():
                  return 1
              if said == "true":
                  others = stable_versions(released)
                  tag_v = stable_versions([tag])[0]
                  if others and others[-1] > tag_v:
                      higher = f"v{'.'.join(map(str, others[-1]))}"
                      return fail(f"::error::the GitHub release for {tag}, read by its id, is this run's and public, with the title and the notes this run wrote and exactly the files this run attested, and this job's publication asked GitHub to make it the repository's latest release; GitHub's listing after the publication shows {higher} published, a higher stable version, so GitHub's latest release may now be {tag}, below it: on the repository's releases page set {higher} as the latest release, then re-run this job, which finds {tag} published and changes nothing, so that job aliases runs")
              print(f"The GitHub release {tag} is this run's and is published, with the title and the notes this run wrote and exactly the files this run attested.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

  # Points `latest` at the highest released version and each X.Y at the highest released
  # X.Y.z, after a release is made (a release candidate moves neither). It decides from what
  # exists when it runs, not from the tag that started it: the versions with a GitHub release
  # that is neither a draft nor a pre-release and whose full version is in the registry, the
  # digest of each read from that full version's tag. So it moves every alias, not only its
  # own tag's, and an alias already right is left alone. One such job runs at a time across
  # all runs (its concurrency group); a newer one waiting replaces an older one waiting, which
  # GitHub cancels, and the newer one, deciding later, covers its release too. A version's own
  # release is made before this job, so a cancelled one leaves no version without its
  # release. Like `publish`, it checks out nothing and runs no script from the repository.
  aliases:
    name: latest and X.Y
    needs: [release_check, release]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.release_check.outputs.candidate != 'true' &&
      needs.release_check.result == 'success' && needs.release.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    concurrency:
      group: cairn-release-aliases
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install oras
        run: |
          base="https://github.com/oras-project/oras/releases/download/v1.3.6/"
          case "$RUNNER_ARCH" in
            X64) asset=oras_1.3.6_linux_amd64.tar.gz sum=66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0 ;;
            ARM64) asset=oras_1.3.6_linux_arm64.tar.gz sum=b84269e78dfc2d5329a4aab373da3200de95e6c138338cf6c66c10c0a3f248c1 ;;
            *) echo "::error::no oras archive is pinned for a runner of $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base$asset"
          printf '%s  %s\n' "$sum" "$RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest and each X.Y at the highest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          released="$(gh release list --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')"
          if [ "$(printf '%s\n' "$released" | grep -c .)" -ge 1000 ]; then
            echo "::error::gh listed 1000 releases, the most it asks for, so a higher one may be missing; raise this step's limit and job release_check's together on main, then run job aliases in the run of a commit that has them"
            exit 1
          fi
          oras repo tags "$image" > "$RUNNER_TEMP/published"
          # The stable versions among the tags on stdin, without their `v`, lowest first: job
          # `release` has this function too, word for word, and says by it which release is
          # GitHub's latest.
          stable_versions() {
            awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print substr($0, 2) }' | sort -t. -k1,1n -k2,2n -k3,3n
          }
          versions="$(printf '%s\n' "$released" | stable_versions | awk -v list="$RUNNER_TEMP/published" '
            BEGIN { while ((getline tag < list) > 0) published[tag] = 1 }
            $0 in published')"
          if [ -z "$versions" ]; then
            echo "No released version is in the registry: latest and X.Y stay where they are."
            exit 0
          fi
          digest_of() {
            local sum
            sum="$(oras manifest fetch "$image:$1" | sha256sum)" || return 1
            printf 'sha256:%s\n' "${sum%% *}"
          }
          point() {
            local want have=""
            want="$(digest_of "$2")"
            if grep -Fxq "$1" "$RUNNER_TEMP/published"; then
              have="$(digest_of "$1")"
            fi
            if [ "$have" = "$want" ]; then
              echo "$1 is $2 already ($want)."
            else
              oras tag "$image@$want" "$1"
              echo "$1 now names $2 ($want)."
            fi
          }
          point latest "$(printf '%s\n' "$versions" | tail -n 1)"
          for line in $(printf '%s\n' "$versions" | cut -d. -f1,2 | sort -u); do
            point "$line" "$(printf '%s\n' "$versions" | awk -F. -v line="$line" '$1 "." $2 == line' | tail -n 1)"
          done

  # Moves the hosted VM to the image `publish` just pushed, by digest, and waits until the VM
  # reports it runs that digest healthy. Pushes to main only. Skipped, not failed, unless the
  # repository variables GCP_INSTANCE and GCP_ZONE are set, so forks and unconfigured copies
  # stay green. The values that name the project or an account are secrets of the
  # `production` environment, not variables, because GitHub prints variables in the log.
  # This job holds the OIDC token, so it runs no image and no test code: only pinned
  # actions and scripts/deploy_production.sh from the checked-out commit.
  # infra/gcp/README.md, "Deploy from GitHub Actions", has the settings and the rollback.
  deploy:
    name: deploy to production
    needs: [lint, test, test_py312, infra, image, publish, verify]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.GCP_INSTANCE != '' && vars.GCP_ZONE != '' &&
      needs.lint.result == 'success' && needs.test.result == 'success' &&
      needs.test_py312.result == 'success' && needs.infra.result == 'success' &&
      needs.image.result == 'success' && needs.publish.result == 'success' &&
      needs.verify.result == 'success'
    runs-on: ${{ fromJSON(vars.CAIRN_RELEASE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    # Required reviewers gate the deploy only when configured. Its secrets are readable only by
    # jobs that run in it, and the identity provider issues a token only to such jobs
    # (infra/gcp/iam.tf), so the name must match github_environment there.
    environment: production
    # One deploy at a time across all runs. A running deploy is never cancelled; one still
    # waiting is replaced by a newer one, so the newest push wins.
    concurrency:
      group: cairn-deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the settings
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT GCP_ARTIFACT_REGISTRY_REPOSITORY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these secrets on the production environment:$missing"
            exit 1
          fi
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The publish job reported no image digest"
            exit 1
          fi
          echo "deploying $DIGEST"
      # skopeo reads the published image from GHCR with this login.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Find the registry host
        id: registry
        env:
          REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
        run: echo "host=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
      - name: Log in to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - name: Copy the image to Artifact Registry, by digest
        env:
          CAIRN_ARTIFACT_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
          CAIRN_SOURCE_IMAGE: ghcr.io/${{ github.repository }}
          CAIRN_COPY_TAG: sha-${{ github.sha }}
        run: bash scripts/deploy_production.sh copy "$DIGEST"
      # A re-run of an old run would otherwise deploy its old image over newer commits.
      - name: Refuse a run that is no longer the head of main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy_production.sh check-head "$GITHUB_SHA"
      # The VM numbers its reports; only one numbered after this counts as an answer.
      - name: Read the VM's report number
        id: seq
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: echo "seq=$(bash scripts/deploy_production.sh seq)" >> "$GITHUB_OUTPUT"
      - name: Point production at the digest
        env:
          CAIRN_ARTIFACT_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
          CAIRN_DEPLOY_TAG: production
        run: bash scripts/deploy_production.sh promote "$DIGEST"
      - name: Wait for the VM to run it, healthy
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          CAIRN_AFTER_SEQ: ${{ steps.seq.outputs.seq }}
          CAIRN_DEPLOY_TIMEOUT: "900"
        run: bash scripts/deploy_production.sh wait "$DIGEST"
      # The VM's report is a hint: anything on the VM that reaches the metadata server can
      # write it. When the public address is configured, it must answer too.
      - name: Check the public address
        if: vars.CAIRN_PUBLIC_URL != ''
        env:
          CAIRN_PUBLIC_URL: ${{ vars.CAIRN_PUBLIC_URL }}
        run: bash scripts/deploy_production.sh check-url
