[project]
name = "cairn-memory"
version = "0.1.0"
description = "Pre-alpha: a provenance-first memory compiler for AI agents, built test-first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50",
    "httpx>=0.28",
    "jinja2>=3.1",
    "markdown-it-py>=4",
    "mcp>=2.3",
    "pydantic>=2.9",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "starlette>=1.10",
    "tzdata>=2026.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# A test that runs this long prints every thread's stack, so a stall names itself.
faulthandler_timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.bandit]
# Job `static_analysis` of .github/workflows/ci-cd.yml runs Bandit over src/ with this file.
# B608 (SQL built from strings) is off: it flags every SQL text cairn puts together, 107
# places at the time it was switched off, and in each the pieces put in are cairn's own (table
# and column names, its per-account index names, `?` placeholder lists, clauses written in
# the code), while every value goes to SQLite as one of the statement's parameters. Every
# other rule stands; a line where one is wrong says so with `# nosec <rule> # <reason>`.
skips = ["B608"]
