{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block nav %}{% endblock %}
{% block main %}
<section class="signin">
  <h1>Sign in</h1>
  <p class="lede">Use an API key minted with <code>key-create</code>. {{ product.name }} keeps only a session cookie, valid for 12 hours.</p>
  {% if error %}
  <p class="alert" role="alert">Refused. {{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="key">API key</label>
    <input id="key" name="key" type="password" autocomplete="current-password" spellcheck="false" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
